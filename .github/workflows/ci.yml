name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-syntax:
    name: shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: bash -n scripts/*.sh
        run: |
          shopt -s nullglob
          for f in scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  guardrails:
    name: forge test + script helpers + viewer unit
    runs-on: ubuntu-latest
    steps:
      # Pin to full commit SHAs so mutable tags cannot be silently retargeted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1

      - name: Install forge-std (if missing)
        working-directory: contracts
        run: |
          if [[ ! -f lib/forge-std/src/Test.sol ]]; then
            forge install foundry-rs/forge-std --no-git --shallow
          fi

      - name: Prepare CI .env (repo-local paths)
        run: |
          sed \
            -e "s|/Users/steveforte/ForteL2|${GITHUB_WORKSPACE}|g" \
            -e "s|/Users/steveforte/src/fortel2/data|${RUNNER_TEMP}/fortel2-data|g" \
            .env.example > .env

      - name: Solidity tests
        working-directory: contracts
        run: forge test -vv

      - name: Script helper tests
        run: ./scripts/test-helpers.sh

      - name: Rail interface check
        run: ./scripts/rail-interface-check.sh

      - name: Phase 7 gate-parity check
        run: ./scripts/phase7-gate-parity.sh

      - name: Pipeline snapshot unit tests
        run: python3 -m unittest scripts/test_pipeline_snapshot.py

      - name: Pipeline viewer + dApp unit tests
        run: node --test viewer/lib.test.js dapp/lib.test.js

      - name: Block viewer unit tests
        run: node --test blocks/lib.test.js

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.7"

      - name: Phase 4 batcher unit tests
        working-directory: batcher
        run: go test ./...

      - name: Phase 5 proposer unit tests
        working-directory: proposer
        run: go test ./...

      - name: Phase 6 derivation unit tests
        working-directory: derivation
        run: go test ./...

      - name: Bridge helper unit tests
        working-directory: scripts/bridge
        run: |
          npm ci
          node --test lib.test.js
