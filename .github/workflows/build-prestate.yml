# Build a Kona/Cannon absolute prestate with chain 852's rollup config baked in.
#
# workflow_dispatch only — this is an expensive, operator-initiated build.
# Firing it on push would be a defect (D-0059).
#
# Two lifetimes, one path: inputs.rollup_config defaults to
# deployments/sepolia/rollup.json. A dispatch at step 0b uses the *current*
# (pre-wipe) config as an end-to-end smoke test; that commitment is thrown
# away. At step 8b the operator replaces the file with the post-wipe config
# and re-runs for the real prestate. Do not treat a smoke-test hash as the
# value to pin in the type-8 game.
#
# Check 2 (F7-9 / D-0062): a second, stock-config build is the negative
# control. Image-grep of the L2 genesis hash was probabilistic (page-straddle
# false FAIL; encoding drift is unprovable) and was chosen when a second
# Docker build was believed to cost 45–90 minutes. Measured runtime is ~4 min
# per build (cannon-builder image is digest-pinned and prebuilt), so the
# doubled-runtime objection is void. The grep and its stock-source
# discriminator step are gone — keeping the grep would reintroduce the
# false-FAIL F7-9 exists to remove.
name: build prestate

on:
  workflow_dispatch:
    inputs:
      rollup_config:
        description: >-
          Path to rollup.json relative to the repo root. Default is the
          tracked file this workflow was built around. Point elsewhere to
          try an alternate copy without editing the workflow.
        required: false
        default: deployments/sepolia/rollup.json
        type: string

permissions:
  contents: read

jobs:
  build:
    name: kona-client cannon prestate
    runs-on: ubuntu-latest
    # Native amd64: do not add QEMU/binfmt — that would silently emulate.
    # 180 minutes: two Docker prestates (custom + stock negative control)
    # plus a native `cannon` rebuild for the witness check. The
    # cannon-builder image is digest-pinned and prebuilt (D-0062: ~4 min
    # each); the happy path is ~10 min. 180 is hang-detection not a target.
    timeout-minutes: 180

    env:
      # Pinned monorepo SHA (D-0059) — use the SHA, not a tag.
      OP_MONOREPO_SHA: da197e45ed44b9fca258b3b0d0709e8dfca1c7cd
      STANDARD_PRESTATES_URL: https://raw.githubusercontent.com/ethereum-optimism/superchain-registry/refs/heads/main/validation/standard/standard-prestates.toml

    steps:
      - name: Checkout ForteL2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout ethereum-optimism/optimism (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ethereum-optimism/optimism
          ref: da197e45ed44b9fca258b3b0d0709e8dfca1c7cd
          path: optimism

      - name: Require rollup config
        env:
          ROLLUP_CONFIG: ${{ inputs.rollup_config }}
        run: |
          set -euo pipefail
          if [[ ! -f "${ROLLUP_CONFIG}" ]]; then
            echo "missing ${ROLLUP_CONFIG} — commit the post-wipe rollup.json first" >&2
            exit 1
          fi
          echo "using rollup config ${ROLLUP_CONFIG}"

      - name: Install just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
        with:
          just-version: "1.56.0"

      - name: Setup Go (native cannon witness binary)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.7"
          # Do not cache the reproducible prestate build. This Go setup is
          # only for the native `cannon witness` self-check.
          cache: false

      - name: Generate Kona custom configs (Route A)
        env:
          ROLLUP_CONFIG: ${{ inputs.rollup_config }}
        run: |
          set -euo pipefail
          python3 .github/prestate/gen-kona-custom-configs.py \
            --rollup "${ROLLUP_CONFIG}" \
            --out "${RUNNER_TEMP}/kona-custom-configs"
          echo "CUSTOM_CONFIGS_DIR=${RUNNER_TEMP}/kona-custom-configs" >> "${GITHUB_ENV}"

      - name: Build kona-client reproducible prestate (custom configs)
        env:
          KONA_CUSTOM_CONFIGS: "true"
          KONA_CUSTOM_CONFIGS_DIR: ${{ env.CUSTOM_CONFIGS_DIR }}
        working-directory: optimism/rust
        run: |
          set -euo pipefail
          # Variant kona-client / prestate-artifacts-cannon only.
          # Do not build kona-client-int — we have no interop depset and it
          # doubles the runtime.
          just build-kona-reproducible-prestate-variant kona-client prestate-artifacts-cannon
          # Both builds write to the same justfile OUTPUT. Copy immediately
          # so the upload/summary cannot pick up the stock overwrite (a
          # stock prestate pinned into the type-8 game cannot be corrected
          # through op-deployer — D-0063 Finding 5).
          SRC="${GITHUB_WORKSPACE}/optimism/rust/kona/prestate-artifacts-cannon"
          DST="${GITHUB_WORKSPACE}/prestate-custom"
          PROOF="${SRC}/prestate-proof.json"
          HASH="$(jq -r .pre "${PROOF}")"
          mkdir -p "${DST}"
          cp "${SRC}/prestate.bin.gz" "${DST}/prestate.bin.gz"
          cp "${PROOF}" "${DST}/prestate-proof.json"
          cp "${SRC}/${HASH}.bin.gz" "${DST}/${HASH}.bin.gz"
          echo "CUSTOM_PRESTATE_DIR=${DST}" >> "${GITHUB_ENV}"
          echo "preserved custom prestate ${HASH} at ${DST}"

      - name: Check 1 — commitment integrity and stateVersion 8
        id: check1
        run: |
          set -euo pipefail
          # The pinned multicannon embeds only cannon-8 (VersionMultiThreaded64_v5).
          # `cannon witness --input` reading the file at all *is* the
          # stateVersion-8 proof: any other version errors `unknown version: N`.
          # This check says nothing about which chain the program can prove
          # (that is check 2 / D-0061). Conflating the two is the defect
          # that produced D-0059's correction.
          cd optimism/cannon
          just cannon
          PRESTATE="${GITHUB_WORKSPACE}/prestate-custom/prestate.bin.gz"
          PROOF="${GITHUB_WORKSPACE}/prestate-custom/prestate-proof.json"
          WITNESS_JSON="$(./bin/cannon witness --input "${PRESTATE}")"
          echo "${WITNESS_JSON}"
          WITNESS_HASH="$(echo "${WITNESS_JSON}" | jq -r .witnessHash)"
          PRE="$(jq -r .pre "${PROOF}")"
          STATE_VERSION="$(echo "${WITNESS_JSON}" | jq -r .stateVersion)"
          echo "witnessHash=${WITNESS_HASH}"
          echo "pre=${PRE}"
          echo "stateVersion=${STATE_VERSION}"
          if [[ "${WITNESS_HASH}" != "${PRE}" ]]; then
            echo "check 1 FAIL: witnessHash ${WITNESS_HASH} != prestate-proof.json .pre ${PRE}" >&2
            exit 1
          fi
          echo "check 1 PASS: witnessHash matches .pre (file parsed, so stateVersion is 8)"
          {
            echo "commitment=${PRE}"
            echo "check1=pass"
            echo "witness_hash=${WITNESS_HASH}"
            echo "state_version=${STATE_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build kona-client reproducible prestate (stock — negative control)
        working-directory: optimism/rust
        run: |
          set -euo pipefail
          # rust/justfile build-kona-reproducible-prestate-variant gates
          # injection on a *non-empty* KONA_CUSTOM_CONFIGS_DIR and derives
          # the Docker --build-arg from that. KONA_CUSTOM_CONFIGS=false
          # with DIR still set would still inject. CUSTOM_CONFIGS_DIR on
          # GITHUB_ENV is a different name and must not be forwarded.
          unset KONA_CUSTOM_CONFIGS KONA_CUSTOM_CONFIGS_DIR
          just build-kona-reproducible-prestate-variant kona-client prestate-artifacts-cannon
          SRC="${GITHUB_WORKSPACE}/optimism/rust/kona/prestate-artifacts-cannon"
          DST="${GITHUB_WORKSPACE}/prestate-stock"
          PROOF="${SRC}/prestate-proof.json"
          HASH="$(jq -r .pre "${PROOF}")"
          mkdir -p "${DST}"
          cp "${SRC}/prestate.bin.gz" "${DST}/prestate.bin.gz"
          cp "${PROOF}" "${DST}/prestate-proof.json"
          cp "${SRC}/${HASH}.bin.gz" "${DST}/${HASH}.bin.gz"
          echo "STOCK_PRESTATE_DIR=${DST}" >> "${GITHUB_ENV}"
          echo "preserved stock prestate ${HASH} at ${DST}"

      - name: Check 2 — custom commitment differs from stock (negative control)
        id: check2
        run: |
          set -euo pipefail
          well_formed() {
            local value="$1"
            local label="$2"
            if [[ ! "${value}" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
              echo "check 2 FAIL: ${label} commitment is not a 32-byte hex hash: ${value}" >&2
              exit 1
            fi
          }
          CUSTOM_PROOF="${GITHUB_WORKSPACE}/prestate-custom/prestate-proof.json"
          STOCK_PROOF="${GITHUB_WORKSPACE}/prestate-stock/prestate-proof.json"
          if [[ ! -f "${CUSTOM_PROOF}" ]]; then
            echo "check 2 FAIL: missing custom prestate-proof.json at ${CUSTOM_PROOF}" >&2
            exit 1
          fi
          if [[ ! -f "${STOCK_PROOF}" ]]; then
            echo "check 2 FAIL: missing stock prestate-proof.json at ${STOCK_PROOF}" >&2
            exit 1
          fi
          CUSTOM_PRE="$(jq -r .pre "${CUSTOM_PROOF}")"
          STOCK_PRE="$(jq -r .pre "${STOCK_PROOF}")"
          well_formed "${CUSTOM_PRE}" "custom"
          well_formed "${STOCK_PRE}" "stock"
          echo "custom_commitment=${CUSTOM_PRE}" >> "${GITHUB_OUTPUT}"
          echo "stock_commitment=${STOCK_PRE}" >> "${GITHUB_OUTPUT}"
          CHECK1="${{ steps.check1.outputs.commitment }}"
          if [[ "${CUSTOM_PRE}" != "${CHECK1}" ]]; then
            echo "check 2 FAIL: preserved custom .pre ${CUSTOM_PRE} != check 1 commitment ${CHECK1}" >&2
            echo "check2=fail" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          if [[ "${CUSTOM_PRE}" == "${STOCK_PRE}" ]]; then
            echo "check 2 FAIL: custom and stock commitments are identical (${CUSTOM_PRE}); custom configs did not land" >&2
            echo "check2=fail" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "check 2 PASS: custom ${CUSTOM_PRE} != stock ${STOCK_PRE}"
          echo "check2=pass" >> "${GITHUB_OUTPUT}"

      - name: Report registry comparison (informational, must not fail the job)
        id: registry
        if: steps.check1.outputs.commitment != ''
        run: |
          set -euo pipefail
          COMMITMENT="${{ steps.check1.outputs.commitment }}"
          TOML="${RUNNER_TEMP}/standard-prestates.toml"
          MATCH="fetch-failed"
          NOTE="could not download standard-prestates.toml"
          if curl -fsSL "${STANDARD_PRESTATES_URL}" -o "${TOML}"; then
            # Live standard-prestates.toml mixes `hash="0x…"` (newer) and
            # `hash = "0x…"` (older). A contiguous hash="…" search would
            # report MATCH=no against a real published entry that uses spaces.
            if grep -E '^[[:space:]]*hash[[:space:]]*=[[:space:]]*"'"${COMMITMENT}"'"' "${TOML}" >/dev/null; then
              MATCH="yes"
              NOTE="computed hash matches a published superchain-registry prestate — surprising for a custom-config build"
            else
              MATCH="no"
              NOTE="no published entry matches (expected: this prestate bakes chain 852)"
            fi
          else
            echo "warning: failed to fetch ${STANDARD_PRESTATES_URL}" >&2
          fi
          echo "match=${MATCH}" >> "${GITHUB_OUTPUT}"
          echo "note=${NOTE}" >> "${GITHUB_OUTPUT}"
          echo "registry comparison: ${MATCH} — ${NOTE}"

      - name: Assert upload source is the custom prestate
        run: |
          set -euo pipefail
          # Same paths the upload step reads. Must equal the custom
          # commitment the summary reports — not whatever currently sits
          # in prestate-artifacts-cannon (the stock build's output).
          PROOF="${GITHUB_WORKSPACE}/prestate-custom/prestate-proof.json"
          PRE="$(jq -r .pre "${PROOF}")"
          CHECK1="${{ steps.check1.outputs.commitment }}"
          if [[ "${PRE}" != "${CHECK1}" ]]; then
            echo "upload source .pre ${PRE} != custom/check 1 commitment ${CHECK1}" >&2
            exit 1
          fi
          echo "upload source commitment ${PRE} matches custom/check 1"

      - name: Job summary
        if: always() && steps.check1.outputs.commitment != ''
        env:
          ROLLUP_CONFIG: ${{ inputs.rollup_config }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/prestate-custom"
          HASH_FILE="$(find "${ARTIFACT_DIR}" -maxdepth 1 -name '0x*.bin.gz' -print -quit || true)"
          {
            echo "## Kona absolute prestate (F7-7 / F7-9)"
            echo
            echo "A dispatch against the *current* \`deployments/sepolia/rollup.json\` is a **smoke test**; throw that commitment away. The real prestate is built at step **8b** after the post-wipe config replaces that file."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commitment (\`.pre\`) | \`${{ steps.check1.outputs.commitment }}\` |"
            echo "| stock commitment (negative control; not for pinning) | \`${{ steps.check2.outputs.stock_commitment }}\` |"
            echo "| check 1 (witnessHash == .pre / stateVersion 8) | ${{ steps.check1.outputs.check1 }} |"
            echo "| check 2 (custom ≠ stock commitment) | ${{ steps.check2.outputs.check2 }} |"
            echo "| registry comparison | ${{ steps.registry.outputs.match }} — ${{ steps.registry.outputs.note }} |"
            echo "| monorepo SHA | \`${OP_MONOREPO_SHA}\` |"
            echo "| rollup config | \`${ROLLUP_CONFIG}\` |"
            echo "| hash-named artifact | \`${HASH_FILE##*/}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload prestate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kona-prestate-cannon
          path: |
            prestate-custom/prestate.bin.gz
            prestate-custom/prestate-proof.json
            prestate-custom/0x*.bin.gz
          if-no-files-found: error
